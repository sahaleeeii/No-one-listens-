<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mood-Based Mute Button: സംസാരിച്ചാൽ മ്യൂട്ട്! (with Recording)</title>
  
  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-yellow: #eab308;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: var(--accent-blue);
    }

    header p {
      color: #94a3b8;
      font-size: 1rem;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1000px;
      width: 100%;
      justify-content: center;
    }

    .video-section, .controls-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      flex: 1 1 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }

    video {
      display: none; /* Processing only, not displayed */
    }

    canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1); /* Mirror camera */
    }

    .status-badge {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 15px;
      transition: all 0.2s ease;
      background: #334155;
      color: #94a3b8;
    }

    .status-badge.unmuted {
      background: rgba(34, 197, 94, 0.2);
      border: 2px solid var(--accent-green);
      color: var(--accent-green);
    }

    .status-badge.muted {
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid var(--accent-red);
      color: var(--accent-red);
    }

    .btn {
      color: #000;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      background: #475569 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
    }

    .btn-start {
      background: var(--accent-blue);
      color: #000;
    }
    .btn-start.running {
      background: #dc2626; /* red when stopping */
      color: white;
    }

    .btn-record {
      background: var(--accent-yellow);
      color: #000;
    }

    .btn-record.recording {
      background: var(--accent-red);
      color: white;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .meter-box {
      width: 100%;
      margin-top: 15px;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .meter-bar-bg {
      width: 100%;
      height: 16px;
      background: #334155;
      border-radius: 8px;
      overflow: hidden;
    }

    .meter-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-green);
      transition: width 0.05s ease, background-color 0.2s;
    }
  </style>
</head>
<body>

  <header>
    <h1>The Mood-Based Mute Button</h1>
    <p>നിങ്ങൾ സംസാരിക്കുമ്പോൾ മ്യൂട്ട് ആകും. വീഡിയോ റെക്കോർഡ് ചെയ്ത് ഗാലറിയിൽ സേവ് ചെയ്യാം.</p>
  </header>

  <div class="main-container">
    <!-- വീഡിയോ ഡിസ്പ്ലേ -->
    <div class="video-section">
      <div class="canvas-container">
        <video id="input_video" playsinline muted></video>
        <canvas id="output_canvas"></canvas>
      </div>
      <div id="statusBadge" class="status-badge">കാത്തിരിക്കുന്നു...</div>
    </div>

    <!-- കൺട്രോളുകൾ -->
    <div class="controls-section">
      <!-- ബട്ടണുകൾ -->
      <button id="startBtn" class="btn btn-start" onclick="toggleEngine()">1. എൻജിൻ സ്റ്റാർട്ട് ചെയ്യുക</button>
      <button id="recordBtn" class="btn btn-record" onclick="toggleRecording()" disabled>2. റെക്കോർഡിംഗ് തുടങ്ങുക</button>

      <!-- ഓഡിയോ മീറ്റർ -->
      <div class="meter-box">
        <div class="meter-label">
          <span>ഔട്ട്പുട്ട് ഓഡിയോ ലെവൽ</span>
          <span id="audioVal">0%</span>
        </div>
        <div class="meter-bar-bg">
          <div id="audioFill" class="meter-bar-fill"></div>
        </div>
      </div>

      <!-- ലിപ് ഡിസ്റ്റൻസ് മീറ്റർ -->
      <div class="meter-box">
        <div class="meter-label">
          <span>വായ തുറക്കുന്ന അളവ്</span>
          <span id="mouthVal">0.00</span>
        </div>
        <div class="meter-bar-bg">
          <div id="mouthFill" class="meter-bar-fill" style="background:var(--accent-blue);"></div>
        </div>
      </div>

      <p style="color: #64748b; font-size: 0.85rem; margin-top: 20px; text-align: center;">
        ശ്രദ്ധിക്കുക: റെക്കോർഡിംഗ് സേവ് ചെയ്യാൻ 'Stop Recording' ബട്ടൺ അമർത്തണം. വീഡിയോ .webm ഫോർമാറ്റിൽ സേവ് ആകും.
      </p>
    </div>
  </div>

  <script>
    let isRunning = false;
    let isRecording = false;
    let camera = null;
    let audioCtx = null;
    let micGainNode = null;
    let analyser = null;
    let micStream = null;
    const threshold = 0.035; // Sensitivity threshold for mouth opening

    let mediaRecorder = null;
    let recordedChunks = [];

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusBadge = document.getElementById('statusBadge');
    const recordBtn = document.getElementById('recordBtn');
    const startBtn = document.getElementById('startBtn');

    // --- ഓഡിയോ ക്രമീകരണങ്ങൾ ---
    async function setupAudio() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        const source = audioCtx.createMediaStreamSource(micStream);
        micGainNode = audioCtx.createGain(); // This will be our mute/unmute node
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;

        source.connect(micGainNode);
        micGainNode.connect(analyser); // Analyser looks at the post-gain audio

        monitorAudioLevel();
      } catch (err) {
        console.error("ഓഡിയോ ആക്സസ് ചെയ്യാൻ കഴിഞ്ഞില്ല:", err);
        alert("മൈക്രോഫോൺ ആക്സസ് അനുവദിക്കുക.");
      }
    }

    // --- ലൈവ് ഓഡിയോ ലെവൽ കാണിക്കാൻ ---
    function monitorAudioLevel() {
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      
      function updateMeter() {
        if (!isRunning) return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        let average = sum / dataArray.length;
        let percentage = Math.min(100, Math.round((average / 128) * 100));

        const fill = document.getElementById('audioFill');
        fill.style.width = percentage + '%';
        document.getElementById('audioVal').innerText = percentage + '%';

        requestAnimationFrame(updateMeter);
      }
      updateMeter();
    }

    // --- ഫേസ് മെഷ് പ്രോസസ്സിംഗ് ---
    function onResults(results) {
      // റെസല്യൂഷൻ സെറ്റ് ചെയ്യുക
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        // മേൽചുണ്ടും (13) കീഴ്ചുണ്ടും (14) തമ്മിലുള്ള അകലം
        const topLip = landmarks[13];
        const bottomLip = landmarks[14];
        const lipDistance = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y);

        // UI അപ്ഡേറ്റ്
        document.getElementById('mouthVal').innerText = lipDistance.toFixed(3);
        let mouthPct = Math.min(100, (lipDistance / 0.1) * 100);
        document.getElementById('mouthFill').style.width = mouthPct + '%';

        // റെഡ് ഡോട്ട് ഇടുക (optional visual cue)
        canvasCtx.fillStyle = 'red';
        [13, 14].forEach(idx => {
          const pt = landmarks[idx];
          canvasCtx.beginPath();
          canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 3, 0, 2 * Math.PI);
          canvasCtx.fill();
        });

        // --- മ്യൂട്ട്/അൺമ്യൂട്ട് ലോജിക് ---
        if (lipDistance > threshold) {
          // സംസാരിക്കുന്നു -> മ്യൂട്ട് ചെയ്യുക
          if (micGainNode) micGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
          statusBadge.innerText = "മ്യൂട്ട്ഡ്! (നിങ്ങൾ സംസാരിക്കുന്നു)";
          statusBadge.className = "status-badge muted";
          document.getElementById('audioFill').style.backgroundColor = "var(--accent-red)";
        } else {
          // മിണ്ടാതിരിക്കുന്നു -> അൺമ്യൂട്ട് ചെയ്യുക
          if (micGainNode) micGainNode.gain.setValueAtTime(1, audioCtx.currentTime);
          statusBadge.innerText = "അൺമ്യൂട്ട്ഡ്! (മിണ്ടാതിരിക്കുന്നു)";
          statusBadge.className = "status-badge unmuted";
          document.getElementById('audioFill').style.backgroundColor = "var(--accent-green)";
        }
      } else {
        statusBadge.innerText = "മുഖം കാണുന്നില്ല!";
        statusBadge.className = "status-badge";
      }
      canvasCtx.restore();
    }

    // --- MediaPipe സെറ്റപ്പ് ---
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    // --- എൻജിൻ സ്റ്റാർട്ട്/സ്റ്റോപ്പ് ---
    async function toggleEngine() {
      if (!isRunning) {
        try {
          statusBadge.innerText = "ക്യാമറയും മൈക്കും റെഡിയാക്കുന്നു...";
          await setupAudio();
          
          camera = new Camera(videoElement, {
            onFrame: async () => {
              if (isRunning) await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
          });
          await camera.start();
          
          isRunning = true;
          startBtn.innerText = "എൻജിൻ സ്റ്റോപ്പ് ചെയ്യുക";
          startBtn.className = "btn btn-start running";
          recordBtn.disabled = false; // Enable recording button
        } catch (err) {
          alert("ക്യാമറ ആക്സസ് അനുവദിക്കുക: " + err.message);
          statusBadge.innerText = "പിശക്!";
        }
      } else {
        // Stop everything
        if (isRecording) stopRecording();
        if (camera) await camera.stop();
        if (micStream) micStream.getTracks().forEach(t => t.stop());
        if (audioCtx) await audioCtx.close();
        
        isRunning = false;
        startBtn.innerText = "1. എൻജിൻ സ്റ്റാർട്ട് ചെയ്യുക";
        startBtn.className = "btn btn-start";
        recordBtn.disabled = true;
        recordBtn.innerText = "2. റെക്കോർഡിംഗ് തുടങ്ങുക";
        recordBtn.className = "btn btn-record";
        statusBadge.innerText = "കാത്തിരിക്കുന്നു...";
        statusBadge.className = "status-badge";
      }
    }

    // --- റെക്കോർഡിംഗ് സ്റ്റാർട്ട്/സ്റ്റോപ്പ് ---
    function toggleRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      
      // 1. ക്യാൻവാസിൽ നിന്നുള്ള വീഡിയോ സ്ട്രീം (30fps)
      const canvasStream = canvasElement.captureStream(30);
      
      // 2. പ്രൊസസ്സ് ചെയ്ത ഓഡിയോ സ്ട്രീം (Muted/Unmuted Audio)
      const audioDestination = audioCtx.createMediaStreamDestination();
      micGainNode.connect(audioDestination); // Connect the gain node output to recording dest

      // 3. രണ്ടും കൂടി യോജിപ്പിക്കുക
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDestination.stream.getAudioTracks()
      ]);

      // 4. MediaRecorder സെറ്റപ്പ്
      try {
        mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp8,opus' });
      } catch (e) {
        // Fallback mimeType if webm not fully supported
        mediaRecorder = new MediaRecorder(combinedStream);
      }

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = saveVideoFile;

      // റെക്കോർഡിംഗ് തുടങ്ങുക
      mediaRecorder.start();
      isRecording = true;
      recordBtn.innerText = "റെക്കോർഡിംഗ് നിർത്തുക (സേവ് ചെയ്യും)";
      recordBtn.className = "btn btn-record recording";
      console.log("റെക്കോർഡിംഗ് തുടങ്ങി...");
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.innerText = "2. റെക്കോർഡിംഗ് തുടങ്ങുക";
        recordBtn.className = "btn btn-record";
        console.log("റെക്കോർഡിംഗ് നിർത്തി.");
      }
    }

    // --- റെക്കോർഡ് ചെയ്ത വീഡിയോ സേവ് ചെയ്യുക ---
    function saveVideoFile() {
      console.log("വീഡിയോ സേവ് ചെയ്യുന്നു...");
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reverse_mute_demo_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.webm`;
      document.body.appendChild(a);
      a.click();
      
      // ക്ലീൻ അപ്പ്
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }
  </script>
</body>
</html>
