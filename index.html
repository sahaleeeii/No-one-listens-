<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mood-Based Mute Button</title>
  
  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --accent-yellow: #eab308;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      color: var(--accent-blue);
    }

    .credits {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.4;
      font-weight: 500;
    }

    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1000px;
      width: 100%;
      justify-content: center;
    }

    .video-section, .controls-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      flex: 1 1 450px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 4/3;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      border: 2px solid #334155;
    }

    video {
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
    }

    .status-badge {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 15px;
      transition: all 0.2s ease;
      background: #334155;
      color: #94a3b8;
    }

    .status-badge.unmuted {
      background: rgba(34, 197, 94, 0.2);
      border: 2px solid var(--accent-green);
      color: var(--accent-green);
    }

    .status-badge.muted {
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid var(--accent-red);
      color: var(--accent-red);
    }

    .btn {
      color: #000;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 15px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      background: #475569 !important;
      color: #94a3b8 !important;
      cursor: not-allowed;
    }

    .btn-start {
      background: var(--accent-blue);
      color: #000;
    }

    .btn-start.running {
      background: #dc2626;
      color: white;
    }

    .btn-record {
      background: var(--accent-yellow);
      color: #000;
    }

    .btn-record.recording {
      background: var(--accent-red);
      color: white;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .meter-box {
      width: 100%;
      margin-top: 15px;
    }

    .meter-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .meter-bar-bg {
      width: 100%;
      height: 16px;
      background: #334155;
      border-radius: 8px;
      overflow: hidden;
    }

    .meter-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-green);
      transition: width 0.05s ease, background-color 0.2s;
    }
  </style>
</head>
<body>

  <header>
    <h1>The Mood-Based Mute Button</h1>
    <div class="credits">
      created by<br>
      <strong>MSP</strong><br>
      Student of icet
    </div>
  </header>

  <div class="main-container">
    <div class="video-section">
      <div class="canvas-container">
        <video id="input_video" playsinline muted></video>
        <canvas id="output_canvas"></canvas>
      </div>
      <div id="statusBadge" class="status-badge">SYSTEM INACTIVE</div>
    </div>

    <div class="controls-section">
      <button id="startBtn" class="btn btn-start" onclick="toggleEngine()">START</button>
      <button id="recordBtn" class="btn btn-record" onclick="toggleRecording()" disabled>Start Recording</button>

      <div class="meter-box">
        <div class="meter-label">
          <span>Output Audio Level</span>
          <span id="audioVal">0%</span>
        </div>
        <div class="meter-bar-bg">
          <div id="audioFill" class="meter-bar-fill"></div>
        </div>
      </div>

      <div class="meter-box">
        <div class="meter-label">
          <span>Lip Distance (Open Mouth Metric)</span>
          <span id="mouthVal">0.00</span>
        </div>
        <div class="meter-bar-bg">
          <div id="mouthFill" class="meter-bar-fill" style="background:var(--accent-blue);"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isRunning = false;
    let isRecording = false;
    let camera = null;
    let audioCtx = null;
    let micGainNode = null;
    let analyser = null;
    let micStream = null;
    const threshold = 0.035;

    let mediaRecorder = null;
    let recordedChunks = [];

    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const statusBadge = document.getElementById('statusBadge');
    const recordBtn = document.getElementById('recordBtn');
    const startBtn = document.getElementById('startBtn');

    async function setupAudio() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        const source = audioCtx.createMediaStreamSource(micStream);
        micGainNode = audioCtx.createGain();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;

        source.connect(micGainNode);
        micGainNode.connect(analyser);

        monitorAudioLevel();
      } catch (err) {
        console.error("Audio Setup Error:", err);
        alert("Microphone access is required.");
      }
    }

    function monitorAudioLevel() {
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      
      function updateMeter() {
        if (!isRunning) return;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) {
          sum += dataArray[i];
        }
        let average = sum / dataArray.length;
        let percentage = Math.min(100, Math.round((average / 128) * 100));

        const fill = document.getElementById('audioFill');
        fill.style.width = percentage + '%';
        document.getElementById('audioVal').innerText = percentage + '%';

        requestAnimationFrame(updateMeter);
      }
      updateMeter();
    }

    function onResults(results) {
      canvasElement.width = videoElement.videoWidth || 640;
      canvasElement.height = videoElement.videoHeight || 480;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];

        const topLip = landmarks[13];
        const bottomLip = landmarks[14];
        const lipDistance = Math.hypot(topLip.x - bottomLip.x, topLip.y - bottomLip.y);

        document.getElementById('mouthVal').innerText = lipDistance.toFixed(3);
        let mouthPct = Math.min(100, (lipDistance / 0.1) * 100);
        document.getElementById('mouthFill').style.width = mouthPct + '%';

        canvasCtx.fillStyle = 'red';
        [13, 14].forEach(idx => {
          const pt = landmarks[idx];
          canvasCtx.beginPath();
          canvasCtx.arc(pt.x * canvasElement.width, pt.y * canvasElement.height, 3, 0, 2 * Math.PI);
          canvasCtx.fill();
        });

        if (lipDistance > threshold) {
          if (micGainNode) micGainNode.gain.setValueAtTime(0, audioCtx.currentTime);
          statusBadge.innerText = "MUTED (SPEAKING DETECTED)";
          statusBadge.className = "status-badge muted";
          document.getElementById('audioFill').style.backgroundColor = "var(--accent-red)";
        } else {
          if (micGainNode) micGainNode.gain.setValueAtTime(1, audioCtx.currentTime);
          statusBadge.innerText = "UNMUTED (SILENT / NEUTRAL)";
          statusBadge.className = "status-badge unmuted";
          document.getElementById('audioFill').style.backgroundColor = "var(--accent-green)";
        }
      } else {
        statusBadge.innerText = "where are you I couldn't see you";
        statusBadge.className = "status-badge";
      }
      canvasCtx.restore();
    }

    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults(onResults);

    async function toggleEngine() {
      if (!isRunning) {
        try {
          statusBadge.innerText = "INITIALIZING...";
          await setupAudio();
          
          camera = new Camera(videoElement, {
            onFrame: async () => {
              if (isRunning) await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
          });
          await camera.start();
          
          isRunning = true;
          startBtn.innerText = "STOP";
          startBtn.className = "btn btn-start running";
          recordBtn.disabled = false;
        } catch (err) {
          alert("Camera or Microphone permission denied: " + err.message);
          statusBadge.innerText = "ERROR";
        }
      } else {
        if (isRecording) stopRecording();
        if (camera) await camera.stop();
        if (micStream) micStream.getTracks().forEach(t => t.stop());
        if (audioCtx) await audioCtx.close();
        
        isRunning = false;
        startBtn.innerText = "START";
        startBtn.className = "btn btn-start";
        recordBtn.disabled = true;
        recordBtn.innerText = "Start Recording";
        recordBtn.className = "btn btn-record";
        statusBadge.innerText = "SYSTEM INACTIVE";
        statusBadge.className = "status-badge";
      }
    }

    function toggleRecording() {
      if (!isRecording) {
        startRecording();
      } else {
        stopRecording();
      }
    }

    function startRecording() {
      recordedChunks = [];
      const canvasStream = canvasElement.captureStream(30);
      
      const audioDestination = audioCtx.createMediaStreamDestination();
      micGainNode.connect(audioDestination);

      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDestination.stream.getAudioTracks()
      ]);

      try {
        mediaRecorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp8,opus' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(combinedStream);
      }

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = saveVideoFile;

      mediaRecorder.start();
      isRecording = true;
      recordBtn.innerText = "Stop & Save Recording";
      recordBtn.className = "btn btn-record recording";
    }

    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.innerText = "Start Recording";
        recordBtn.className = "btn btn-record";
      }
    }

    function saveVideoFile() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `reverse_mute_demo_${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }
  </script>
</body>
</html>
